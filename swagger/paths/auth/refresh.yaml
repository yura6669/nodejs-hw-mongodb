tags:
  - Auth
summary: Refresh a user's JWT token
operationId: refreshToken
description: "Refresh a user's JWT token using this endpoint. The user must provide a valid refresh token to obtain a new access token."
responses:
  '200':
    description: Successfully refreshed a session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: '489sD9225JEgkYAUVxdHgnGlPor4aydlEXqwsrzT'
  '404':
    $ref: '../../components/responses/404.yaml'
