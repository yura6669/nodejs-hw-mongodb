tags:
  - Auth
summary: Login a user
operationId: loginUser
description: 'Login a user with this endpoint. The user will receive a JWT token upon successful login, which can be used for subsequent requests.'
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'john@gmail.com'
          password:
            description: "User's password"
            type: string
            example: 'password123'
responses:
  '200':
    description: Successfully logged in a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in a user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: '489sD9225JEgkYAUVxdHgnGlPor4aydlEXqwsrzT'
  '404':
    $ref: '../../components/responses/404.yaml'
