tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: 'Register a new user with this endpoint. The user will be able to create and manage contacts after registration.'
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'john@gmail.com'
          password:
            description: "User's password"
            type: string
            example: 'password123'
responses:
  '201':
    description: Successfully registered a new user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              properties:
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  example: 'john@gmail.com'
                _id:
                  type: string
                  example: '65ca67e7ae7f10c88b598384'
                createdAt:
                  type: string
                  format: date-time
                  example: '2023-10-01T12:00:00Z'
                updatedAt:
                  type: string
                  format: date-time
                  example: '2023-10-01T12:00:00Z'
  '404':
    $ref: '../../components/responses/404.yaml'
